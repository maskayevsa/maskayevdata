paths:
  base_dir: "."
  go2rtc_dir: ".\\Go2RTC"
  go2rtc_exe: ".\\Go2RTC\\go2rtc.exe"
  ffmpeg_exe: ".\\Go2RTC\\ffmpeg.exe"
  rec_dir: ".\\Rec"
  data_dir: ".\\data"
  snapshots_dir: ".\\data\\snapshots"
  db_path: ".\\data\\events.db"
  logs_dir: ".\\logs"

streams:
  rtsp_hd: "rtsp://127.0.0.1:8554/glazok_hd"
  rtsp_fast: "rtsp://127.0.0.1:8554/glazok_fast"

modules:
  recorder_enabled: true     # Включить/выключить фоновую запись архива
  cv_realtime_enabled: true  # Включить/выключить распознавание "на лету"
  web_enabled: true          # Включить/выключить веб-интерфейс

recorder:
  segment_seconds: 300       # Длина одного файла (300 сек = 5 минут)
  container: "mkv"           # Контейнер .mkv для защиты от сбоев питания
  max_size_gb: 50            # Максимальный размер папки Rec в ГБ
  max_days: 30               # Максимальный срок хранения в днях
  cleanup_interval_sec: 300  # Как часто проверять лимиты диска (раз в 5 мин)

hardware:
  cuda_device_order: "PCI_BUS_ID"
  gpu_id: 0                  # Индекс видеокарты CUDA (0 - первая, 1 - вторая)

web:
  host: "0.0.0.0"            # Доступно по локальному IP вашего ПК и через VPN
  port: 8081
