<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Видеоглазок AI</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 12px; }
        .container { max-width: 820px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
        .nav { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
        .nav a { text-decoration: none; color: #bbb; background: #1e1e1e; padding: 8px 14px; border-radius: 6px; font-size: 14px; }
        .nav a.active { background: #2563eb; color: #fff; font-weight: bold; }
        .card { background: #1e1e1e; border-radius: 8px; padding: 10px; margin-bottom: 12px; display: flex; gap: 12px; flex-wrap: wrap; border: 1px solid #2c2c2c; }
        .card img { width: 220px; max-width: 100%; border-radius: 6px; object-fit: cover; }
        .info { flex: 1; min-width: 240px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .badge { padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 14px; }
        .badge.known { background: #166534; color: #bbf7d0; }
        .badge.unknown { background: #991b1b; color: #fecaca; }
        .dir { font-size: 13px; color: #93c5fd; font-weight: bold; }
        .meta { font-size: 12px; color: #9ca3af; margin-bottom: 4px; }
        .assign-form { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        input, select, button { background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 10px; border-radius: 5px; font-size: 13px; }
        button { background: #2563eb; border: none; cursor: pointer; font-weight: 500; }
        button:hover { background: #1d4ed8; }
        .btn-danger { background: #b91c1c; }
        .btn-snap { background: #059669; }
        .person-row, .tool-box { background: #1e1e1e; padding: 12px; border-radius: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .tool-box { display: block; }
        hr { border: 0; border-top: 1px solid #333; margin: 16px 0; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h2 style="margin:0;">👁 Видеоглазок AI</h2>
        <form method="post" action="/manual_snapshot">
            <button type="submit" class="btn-snap">📸 Сделать фото сейчас</button>
        </form>
    </div>
    <div class="nav">
        <a href="/?tab=events" class="{{ACT_EVENTS}}">Лента событий</a>
        <a href="/?tab=persons" class="{{ACT_PERSONS}}">База лиц ({{PERSONS_COUNT}})</a>
        <a href="/?tab=tools" class="{{ACT_TOOLS}}">Архив и Песочница</a>
        <a href="/?tab=sandbox" class="{{ACT_SANDBOX}}">Результаты песочницы</a>
    </div>
    {{CONTENT_BLOCK}}
</div>
</body>
</html>
